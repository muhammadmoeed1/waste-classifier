name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check src tests scripts

      - name: Run tests
        run: pytest -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This is the actual artifact that gets deployed (Render uses this exact
      # Dockerfile) -- the test/lint job above never verifies it still builds.
      - name: Build deployable image (lite profile)
        run: docker build -f docker/Dockerfile.lite -t waste-classifier-lite .
