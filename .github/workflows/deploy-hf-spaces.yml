name: Deploy to Hugging Face Spaces

# Auto-deploys the app to a HF Space on every push to main.
# Requires two repository secrets (Settings -> Secrets and variables -> Actions):
#   HF_TOKEN      - a Hugging Face access token with write access
#   HF_SPACE_REPO - e.g. "your-username/waste-classifier"

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Prepend HF Spaces metadata to README
        run: |
          cat > space_readme_header.md << 'EOF'
          ---
          title: Smart Waste Classifier
          emoji: ♻️
          colorFrom: green
          colorTo: blue
          sdk: docker
          app_port: 7860
          pinned: false
          ---

          EOF
          cat README.md >> space_readme_header.md
          mv space_readme_header.md README.md

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO: ${{ secrets.HF_SPACE_REPO }}
        run: |
          git lfs install
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add README.md
          git commit -m "chore: inject HF Spaces metadata" || true
          git remote add space https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_REPO} || true
          git push --force space HEAD:main
